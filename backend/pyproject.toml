[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iotmonitor-backend"
version = "0.1.0"
description = "FastAPI backend for IoTMonitor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi[standard]>=0.115,<1.0"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
